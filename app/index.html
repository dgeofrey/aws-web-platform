<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Snake</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a33;
      --grid: #18213f;
      --text: #e6ebff;
      --muted: #8a94b8;
      --snake: #3ee08f;
      --snake-head: #9dffcb;
      --food: #ff5c7a;
      --accent: #6c8cff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 16px;
      -webkit-user-select: none;
      user-select: none;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .scores {
      display: flex;
      gap: 24px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .scores strong { color: var(--text); font-size: 20px; }

    .board {
      position: relative;
      width: min(92vw, 480px);
      aspect-ratio: 1;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 0 0 1px #24305a, 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 12px;
      background: rgba(11, 16, 32, 0.82);
      text-align: center;
      padding: 16px;
    }

    .overlay[hidden] { display: none; }
    .overlay h2 { margin: 0; font-size: 24px; }
    .overlay p { margin: 0; color: var(--muted); }

    button {
      font: inherit;
      color: var(--text);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      padding: 10px 22px;
      cursor: pointer;
    }

    button:focus-visible { outline: 2px solid var(--snake-head); outline-offset: 2px; }

    .dpad {
      display: none;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 8px;
    }

    .dpad button {
      padding: 0;
      font-size: 22px;
      background: var(--panel);
      box-shadow: 0 0 0 1px #24305a;
    }

    .dpad .up { grid-column: 2; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }

    @media (pointer: coarse) {
      .dpad { display: grid; }
      .keys { display: none; }
    }

    .keys { color: var(--muted); font-size: 14px; margin: 0; }

    footer {
      margin-top: auto;
      color: var(--muted);
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div class="scores">
    <span>Score <strong id="score">0</strong></span>
    <span>Best <strong id="best">0</strong></span>
  </div>

  <div class="board">
    <canvas id="game" width="480" height="480" aria-label="Snake game board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Snake</h2>
      <p id="overlay-text">Eat the food. Don't hit the walls or yourself.</p>
      <button id="start">Start</button>
    </div>
  </div>

  <p class="keys">Arrow keys or WASD to move · Space to pause</p>

  <div class="dpad" aria-label="Controls">
    <button class="up" data-dir="up" aria-label="Up">▲</button>
    <button class="left" data-dir="left" aria-label="Left">◀</button>
    <button class="down" data-dir="down" aria-label="Down">▼</button>
    <button class="right" data-dir="right" aria-label="Right">▶</button>
  </div>

  <footer id="served-by">Served by …</footer>

  <script>
    (function () {
      const GRID = 20;
      const START_SPEED_MS = 140;
      const MIN_SPEED_MS = 60;
      const SPEED_STEP_MS = 4;

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const cell = canvas.width / GRID;

      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayText = document.getElementById("overlay-text");
      const startBtn = document.getElementById("start");

      const DIRS = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 },
      };

      const KEYS = {
        ArrowUp: "up", KeyW: "up",
        ArrowDown: "down", KeyS: "down",
        ArrowLeft: "left", KeyA: "left",
        ArrowRight: "right", KeyD: "right",
      };

      let snake, dir, queue, food, score, speed, timer, state;
      let best = readBest();
      bestEl.textContent = best;

      function readBest() {
        try { return Number(localStorage.getItem("snake-best")) || 0; } catch (e) { return 0; }
      }

      function saveBest(value) {
        try { localStorage.setItem("snake-best", String(value)); } catch (e) { /* storage unavailable */ }
      }

      function reset() {
        const mid = Math.floor(GRID / 2);
        snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
        dir = DIRS.right;
        queue = [];
        score = 0;
        speed = START_SPEED_MS;
        scoreEl.textContent = score;
        placeFood();
      }

      function placeFood() {
        const free = [];
        for (let x = 0; x < GRID; x++) {
          for (let y = 0; y < GRID; y++) {
            if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
          }
        }
        food = free[Math.floor(Math.random() * free.length)];
      }

      function turn(name) {
        const next = DIRS[name];
        const last = queue.length ? queue[queue.length - 1] : dir;
        // Ignore reversals and repeats; allow two queued turns for quick corners
        if (next.x === -last.x && next.y === -last.y) return;
        if (next === last || queue.length >= 2) return;
        queue.push(next);
      }

      function step() {
        if (queue.length) dir = queue.shift();

        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
        const willEat = head.x === food.x && head.y === food.y;
        const body = willEat ? snake : snake.slice(0, -1);
        const hitSelf = body.some(s => s.x === head.x && s.y === head.y);

        if (hitWall || hitSelf) return gameOver();

        snake.unshift(head);
        if (willEat) {
          score += 1;
          scoreEl.textContent = score;
          speed = Math.max(MIN_SPEED_MS, speed - SPEED_STEP_MS);
          if (snake.length === GRID * GRID) return gameOver(true);
          placeFood();
        } else {
          snake.pop();
        }

        draw();
        timer = setTimeout(step, speed);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = getVar("--grid");
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID; i++) {
          ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
        }

        ctx.fillStyle = getVar("--food");
        ctx.beginPath();
        ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.36, 0, Math.PI * 2);
        ctx.fill();

        snake.forEach((s, i) => {
          ctx.fillStyle = getVar(i === 0 ? "--snake-head" : "--snake");
          roundRect(s.x * cell + 2, s.y * cell + 2, cell - 4, cell - 4, 5);
        });
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.fill();
      }

      function getVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function start() {
        reset();
        state = "playing";
        overlay.hidden = true;
        draw();
        clearTimeout(timer);
        timer = setTimeout(step, speed);
      }

      function togglePause() {
        if (state === "playing") {
          state = "paused";
          clearTimeout(timer);
          showOverlay("Paused", "Press Space to resume.", "Resume");
        } else if (state === "paused") {
          state = "playing";
          overlay.hidden = true;
          timer = setTimeout(step, speed);
        }
      }

      function gameOver(won) {
        state = "over";
        clearTimeout(timer);
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          saveBest(best);
        }
        showOverlay(won ? "You win!" : "Game over", "Score: " + score, "Play again");
      }

      function showOverlay(title, text, label) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        startBtn.textContent = label;
        overlay.hidden = false;
        startBtn.focus();
      }

      startBtn.addEventListener("click", () => (state === "paused" ? togglePause() : start()));

      document.addEventListener("keydown", e => {
        if (e.code === "Space") {
          e.preventDefault();
          if (state === "playing" || state === "paused") togglePause();
          else start();
          return;
        }
        const name = KEYS[e.code];
        if (name && state === "playing") {
          e.preventDefault();
          turn(name);
        }
      });

      document.querySelectorAll(".dpad button").forEach(btn => {
        btn.addEventListener("pointerdown", e => {
          e.preventDefault();
          if (state === "playing") turn(btn.dataset.dir);
        });
      });

      // Swipe controls on the board
      let touchStart = null;
      canvas.addEventListener("touchstart", e => {
        const t = e.changedTouches[0];
        touchStart = { x: t.clientX, y: t.clientY };
      }, { passive: true });

      canvas.addEventListener("touchend", e => {
        if (!touchStart || state !== "playing") return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStart.x;
        const dy = t.clientY - touchStart.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
        touchStart = null;
      });

      // Show which instance and Availability Zone served this page
      fetch("/instance.json", { cache: "no-store" })
        .then(r => (r.ok ? r.json() : Promise.reject()))
        .then(info => {
          document.getElementById("served-by").textContent =
            "Served by " + info.instance_id + " · " + info.availability_zone + " · build " + info.app_version;
        })
        .catch(() => {
          document.getElementById("served-by").textContent = "Running locally";
        });

      reset();
      draw();
      state = "ready";
    })();
  </script>
</body>
</html>
